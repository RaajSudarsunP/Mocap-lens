<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MocapLens Debug 3 — MediaPipe FaceLandmarker Test</title>
  <style>
    body { margin: 0; background: #0c1017; color: #fff; font-family: monospace; padding: 20px; }
    #info { background: #141a24; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    .stage { position: relative; width: 640px; height: 360px; }
    video { width: 640px; height: 360px; background: #000; border-radius: 8px; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; width: 640px; height: 360px; pointer-events: none; transform: scaleX(-1); }
    .err { color: #ef4444; font-weight: bold; }
    .ok { color: #22c55e; font-weight: bold; }
  </style>
</head>
<body>
  <div id="info">
    <h2>MocapLens Debug 3: MediaPipe FaceLandmarker Test</h2>
    <div id="status">Loading MediaPipe Tasks Vision Wasm...</div>
    <div id="details"></div>
  </div>

  <div class="stage">
    <video id="webcam-video" autoplay playsinline muted></video>
    <canvas id="landmark-canvas"></canvas>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    const statusEl = document.getElementById('status');
    const detailsEl = document.getElementById('details');
    const video = document.getElementById('webcam-video');
    const canvas = document.getElementById('landmark-canvas');
    const ctx = canvas.getContext('2d');

    let landmarker = null;
    let lastVideoTime = -1;

    async function initFaceTracking() {
      try {
        statusEl.textContent = "Step 1: Fetching Vision Tasks Wasm from CDN...";
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        statusEl.textContent = "Step 2: Creating FaceLandmarker task model...";
        landmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "LIVE_STREAM",
          numFaces: 1,
          outputFaceBlendshapes: true,
          outputFacialTransformationMatrixes: true
        });

        statusEl.textContent = "Step 3: Initializing camera...";
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: false });
        video.srcObject = stream;

        video.onloadedmetadata = () => {
          video.play();
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          statusEl.className = "ok";
          statusEl.textContent = "MediaPipe & Camera Active — Detecting Faces... ✅";
          requestAnimationFrame(detectLoop);
        };

      } catch (err) {
        console.warn("GPU Delegate failed, trying CPU delegate...", err);
        try {
          const filesetResolver = await FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
          );
          landmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
            baseOptions: {
              modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
              delegate: "CPU"
            },
            runningMode: "LIVE_STREAM",
            numFaces: 1,
            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true
          });
          statusEl.className = "ok";
          statusEl.textContent = "MediaPipe Active (CPU Fallback) ✅";
          requestAnimationFrame(detectLoop);
        } catch (cpuErr) {
          statusEl.className = "err";
          statusEl.textContent = "MediaPipe Initialization Failed ❌";
          detailsEl.innerHTML = `<div>Error: ${cpuErr.message}</div>`;
          console.error("MediaPipe Init Error:", cpuErr);
        }
      }
    }

    function detectLoop() {
      if (landmarker && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = landmarker.detectForVideo(video, Date.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          const blendshapes = results.faceBlendshapes ? results.faceBlendshapes[0].categories : [];

          detailsEl.innerHTML = `
            <div><strong>Faces Detected:</strong> ${results.faceLandmarks.length}</div>
            <div><strong>Landmark Count:</strong> ${landmarks.length} / 468</div>
            <div><strong>Blendshapes Count:</strong> ${blendshapes.length}</div>
            <div><strong>Jaw Open Score:</strong> ${(blendshapes.find(b => b.categoryName === 'jawOpen')?.score || 0).toFixed(3)}</div>
          `;

          // Draw landmark dots
          ctx.fillStyle = "#00f0ff";
          landmarks.forEach((pt, i) => {
            if (i % 3 === 0) {
              ctx.beginPath();
              ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 2, 0, 2 * Math.PI);
              ctx.fill();
            }
          });
        } else {
          detailsEl.innerHTML = "<div>Searching for face...</div>";
        }
      }
      requestAnimationFrame(detectLoop);
    }

    initFaceTracking();
  </script>
</body>
</html>
