<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MocapLens Debug 1 — Three.js WebGL Render Test</title>
  <style>
    body { margin: 0; background: #0c1017; color: #fff; font-family: monospace; overflow: hidden; }
    #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; z-index: 10; }
    #container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="info">
    <div><strong>MocapLens Debug 1: Three.js WebGL Render Test</strong></div>
    <div id="status">Initializing WebGL...</div>
    <div id="gpu">GPU: --</div>
    <div id="fps">FPS: --</div>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    const statusEl = document.getElementById('status');
    const gpuEl = document.getElementById('gpu');
    const fpsEl = document.getElementById('fps');
    const container = document.getElementById('container');

    try {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x141a24);

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 4);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0x0284c7, 2.0);
      dirLight.position.set(2, 4, 3);
      scene.add(dirLight);

      // Rotating Mesh
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3, metalness: 0.2 });
      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);

      // Detect GPU info
      const gl = renderer.getContext();
      const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
      if (debugInfo) {
        gpuEl.textContent = "GPU: " + gl.getParameter(debugInfo.UNMASKED_RENDERER_GL_STRING);
      } else {
        gpuEl.textContent = "GPU: WebGL Active";
      }

      statusEl.textContent = "Status: WebGL Rendering Active ✅";

      let frames = 0;
      let lastTime = Date.now();

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);

        frames++;
        const now = Date.now();
        if (now - lastTime >= 1000) {
          fpsEl.textContent = `FPS: ${frames}`;
          frames = 0;
          lastTime = now;
        }
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

    } catch (err) {
      statusEl.textContent = "Status: WebGL FAILED ❌ (" + err.message + ")";
      console.error("WebGL Init Error:", err);
    }
  </script>
</body>
</html>
