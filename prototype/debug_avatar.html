<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MocapLens Debug 4 — Three.js 3D Avatar Test</title>
  <style>
    body { margin: 0; background: #0c1017; color: #fff; font-family: monospace; overflow: hidden; }
    #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 16px; border-radius: 8px; z-index: 10; width: 300px; }
    #viewport { width: 100vw; height: 100vh; }
    .control { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
    input[type=range] { width: 150px; }
  </style>
</head>
<body>
  <div id="info">
    <div><strong>MocapLens Debug 4: 3D Avatar Test</strong></div>
    <div id="status">Loading Three.js Avatar...</div>
    <hr style="border: 1px solid #333; margin: 10px 0;">
    <div class="control">
      <span>Jaw Open:</span>
      <input type="range" id="jaw-slider" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="control">
      <span>Smile:</span>
      <input type="range" id="smile-slider" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="control">
      <span>Blink:</span>
      <input type="range" id="blink-slider" min="0" max="1" step="0.01" value="0">
    </div>
  </div>
  <div id="viewport"></div>

  <script type="module">
    import { ThreeAvatarViewer } from './src/rendering/three_avatar_viewer.js';

    const statusEl = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const jawSlider = document.getElementById('jaw-slider');
    const smileSlider = document.getElementById('smile-slider');
    const blinkSlider = document.getElementById('blink-slider');

    try {
      const avatarViewer = new ThreeAvatarViewer(viewport);
      avatarViewer.initialize();

      if (avatarViewer.isReady && avatarViewer.avatarMesh) {
        statusEl.innerHTML = "<span style='color:#22c55e;'>Avatar Mesh Loaded ✅</span>";
      } else {
        statusEl.innerHTML = "<span style='color:#ef4444;'>Avatar Init Failed ❌</span>";
      }

      // Interactive test loop
      let blendshapes = new Array(52).fill(0.0);
      let quat = [1, 0, 0, 0];
      let trans = [0, 0, 0];

      function renderLoop() {
        requestAnimationFrame(renderLoop);

        // Update test blendshapes from sliders
        blendshapes[17] = parseFloat(jawSlider.value);    // jawOpen
        blendshapes[23] = parseFloat(smileSlider.value);  // mouthSmileLeft
        blendshapes[24] = parseFloat(smileSlider.value);  // mouthSmileRight
        blendshapes[0] = parseFloat(blinkSlider.value);   // eyeBlinkLeft
        blendshapes[7] = parseFloat(blinkSlider.value);   // eyeBlinkRight

        avatarViewer.updateAvatar(blendshapes, quat, trans);
      }

      renderLoop();

    } catch (err) {
      statusEl.innerHTML = "<span style='color:#ef4444;'>Error: " + err.message + "</span>";
      console.error("Avatar Debug Error:", err);
    }
  </script>
</body>
</html>
